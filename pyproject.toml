[project]
name = "completion-first-data"
version = "0.1.0"
description = "Completion-first raw/replay data acquisition pipeline"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31.0",
  "websockets>=12.0",
  "py-clob-client-v2>=1.0.0",
  "numpy>=1.26.0",
  "matplotlib>=3.8.0",
  "plotly>=5.18.0",
  "duckdb>=1.1.0",
]

[project.scripts]
cfdata = "completion_first_data.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
